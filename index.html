<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Block Room - Mobile FPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            overflow: hidden;
            touch-action: none;
            background: #000;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* Left side - movement zone with visible joystick */
        #joystick-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 100;
            touch-action: none;
        }
        
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, rgba(255,255,255,0.6), rgba(200,200,200,0.4));
            border: 3px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        /* Jump button - larger and more visible */
        #jump-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, rgba(100,200,100,0.5), rgba(50,150,50,0.4));
            border: 4px solid rgba(100, 255, 100, 0.6);
            border-radius: 50%;
            z-index: 100;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        #jump-btn::after {
            content: "JUMP";
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #jump-btn:active {
            background: linear-gradient(145deg, rgba(150,255,150,0.7), rgba(100,200,100,0.6));
            transform: scale(0.95);
        }
        
        /* Look zone - entire screen except UI elements */
        #look-zone {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
        }
        
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            z-index: 100;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
        
        /* Instructions overlay */
        #instructions {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            z-index: 200;
            text-align: center;
            font-size: 16px;
            max-width: 90%;
        }
        
        #instructions.hidden {
            display: none;
        }
        
        #instructions h2 {
            margin-bottom: 15px;
            color: #4CAF50;
        }
        
        #instructions p {
            margin: 10px 0;
        }
        
        #start-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="look-zone"></div>
    
    <div id="info">
        <div>FPS: <span id="fps">0</span></div>
    </div>
    
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>
    
    <div id="jump-btn"></div>
    
    <div id="instructions">
        <h2>Block Room FPS</h2>
        <p>🕹️ Left joystick: Move</p>
        <p>👆 Right side: Look around</p>
        <p>🔵 JUMP button: Jump</p>
        <button id="start-btn">START GAME</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
